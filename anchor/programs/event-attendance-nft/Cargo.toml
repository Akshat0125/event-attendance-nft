[package]
name = "event_attendance_nft"
version = "0.1.0"
description = "Event Attendance NFT program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "event_attendance_nft"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.0.0"
anchor-spl = { version = "=1.0.0", features = ["metadata"] }
getrandom = "0.3"

[dev-dependencies]
litesvm = "0.6"
solana-sdk = "=2.2.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
